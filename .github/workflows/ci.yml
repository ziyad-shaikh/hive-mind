name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check & compile
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Package extension (.vsix)
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: hive-mind-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
